name: CI

# One run per change. A branch is checked by its pull request and `main` by the push that
# lands on it — with both triggers unfiltered, pushing to a branch that has a pull request open
# ran every job twice for the same commit. A branch with no pull request yet can still be run
# by hand.
#
# A change that touches nothing but prose runs nothing. No job reads it: Prettier ignores
# Markdown and `docs/` (`.prettierignore`), no test opens either, and neither is copied into the
# image, so a preview deployed from it would be the one already running. A change that touches
# prose *and* anything else runs everything, as before.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Both seams run against a real Postgres. Nothing of ours is mocked in either.
  TEST_DATABASE_URL: postgres://ricambi:ricambi@localhost:5432/ricambi_test
  E2E_DATABASE_URL: postgres://ricambi:ricambi@localhost:5432/ricambi_e2e

jobs:
  # **Code CI has already seen green is not tested again.** A pull request is tested as the
  # commit it would merge into (`refs/pull/N/merge`), and `green` below leaves a marker named
  # after that commit's tree when every seam has passed. Merged while `main` stood still, the
  # merge commit has the same tree, so the push to `main` finds the marker and goes straight to
  # the preview: the code it deploys is byte for byte the code that passed.
  #
  # A Release merge (ADR 0016) changes nothing but the Version and the changelog, and the
  # release pull request is never tested itself. For a push that changes only those, the tree
  # looked up is its parent's, the code the Release is cut from.
  #
  # Only pushes to `main` are let through this way. A pull request is always tested in full.
  already-green:
    name: Already tested?
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      green: ${{ steps.lookup.outputs.green }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - id: lookup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          changed="$(git diff --name-only HEAD^1 HEAD)"
          others="$(grep -vxE 'CHANGELOG\.md|\.release-please-manifest\.json|package\.json' <<<"$changed" || true)"
          # Every line package.json gains or loses is its "version".
          package_lines="$(git diff -U0 HEAD^1 HEAD -- package.json | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' || true)"
          if [ -n "$changed" ] && [ -z "$others" ] &&
            { [ -z "$package_lines" ] || ! grep -qvE '^[-+][[:space:]]*"version":' <<<"$package_lines"; }; then
            tree="$(git rev-parse 'HEAD^1^{tree}')"
            echo "Only the Version and the changelog changed, so this looks for its parent's tree, $tree."
          fi
          # A marker counts only from a run of this repository, never from a fork's. When the
          # question cannot be asked, the answer is no and everything is tested.
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=green-tree-$tree" \
            --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == $GITHUB_REPOSITORY_ID)] | length" \
            || echo 0)"
          if [ "$count" -gt 0 ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
            echo "Tree $tree has passed CI before, so this push goes straight to the preview." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Typecheck, lint and format
    needs: already-green
    if: needs.already-green.outputs.green != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  # Split across two machines, each with its own Postgres, running half of the test files.
  api-tests:
    name: API seam (${{ matrix.shard }}/2)
    needs: already-green
    if: needs.already-green.outputs.green != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        # The official image, from Google's mirror of Docker Hub. Runners share addresses, and
        # both Docker Hub's anonymous pull limit and AWS's public mirror's data limit have failed
        # this job before a single test has run.
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: ricambi
          POSTGRES_PASSWORD: ricambi
          POSTGRES_DB: ricambi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ricambi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # An uploaded catalog is rendered with Poppler, as it is in the image (issue #57).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pnpm test:api --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-test-results-${{ matrix.shard }}
          path: apps/api/test-results/
          if-no-files-found: ignore

  # Split across six machines, each with its own Postgres and its own built app, running a
  # sixth of the tests one at a time. One machine ran them all in 17 minutes; six keep the
  # browser seam about as long as the API seam. Standard runners cost nothing for a public
  # repository.
  e2e-tests:
    name: Browser seam (${{ matrix.shard }}/6)
    needs: already-green
    if: needs.already-green.outputs.green != 'true'
    runs-on: ubuntu-latest
    strategy:
      # Every share runs to the end, so one failure shows all the others with it.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        # The official image, from Google's mirror of Docker Hub. Runners share addresses, and
        # both Docker Hub's anonymous pull limit and AWS's public mirror's data limit have failed
        # this job before a single test has run.
        image: mirror.gcr.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: ricambi
          POSTGRES_PASSWORD: ricambi
          POSTGRES_DB: ricambi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ricambi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ricambi/web exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore

  image:
    name: Container image builds
    needs: already-green
    if: needs.already-green.outputs.green != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Neither BuildKit nor the base image is pulled from Docker Hub here. Runners share
      # addresses and its anonymous pull limit fails this job before the Dockerfile is read, so
      # both come from Google's mirror of the same official images, as Postgres does above. The
      # Dockerfile itself is untouched: `build-contexts` only says where this job finds the image
      # it names.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-contexts: |
            node:24-bookworm-slim=docker-image://mirror.gcr.io/library/node:24-bookworm-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The marker `already-green` looks for: this tree passed every seam. Kept as long as a pull
  # request is likely to wait between its last run and its merge.
  green:
    name: Mark the tree as tested
    needs: [already-green, check, api-tests, e2e-tests, image]
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.sha }}" > tested-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: green-tree-${{ needs.already-green.outputs.tree }}
          path: tested-commit.txt
          retention-days: 14

  deploy-preview:
    name: Deploy the preview
    # Only what is on main, and only once every seam has passed, here or on a tree CI has
    # already seen green: the preview is what people are shown, so it never runs anything CI
    # has not seen green.
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.already-green.outputs.green == 'true' || (needs.check.result == 'success' &&
      needs.api-tests.result == 'success' && needs.e2e-tests.result == 'success' &&
      needs.image.result == 'success'))
    needs: [already-green, check, api-tests, e2e-tests, image]
    runs-on: ubuntu-latest
    steps:
      # The Dokploy panel is not on the public internet, so the runner joins the tailnet it is on
      # for the length of this job, as an ephemeral node that removes itself afterwards.
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      # Dokploy does the build and the restart; this only tells it to start. Where it lives and
      # the key that lets us ask are repository secrets, never written here (AGENTS.md, Security).
      - name: Ask Dokploy to deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          for name in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_COMPOSE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set, so the preview was not deployed."
              exit 1
            fi
          done
          # A secret is masked only where it appears whole, and curl names the host alone when it
          # cannot reach it.
          host="${DOKPLOY_URL#*://}"
          host="${host%%/*}"
          echo "::add-mask::$host"
          echo "::add-mask::${host%%:*}"
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --header 'content-type: application/json' \
            --data "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}"
