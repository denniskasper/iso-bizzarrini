name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Both seams run against a real Postgres. Nothing of ours is mocked in either.
  TEST_DATABASE_URL: postgres://ricambi:ricambi@localhost:5432/ricambi_test
  E2E_DATABASE_URL: postgres://ricambi:ricambi@localhost:5432/ricambi_e2e

jobs:
  check:
    name: Typecheck, lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  api-tests:
    name: API seam (real HTTP, real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ricambi
          POSTGRES_PASSWORD: ricambi
          POSTGRES_DB: ricambi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ricambi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: apps/api/test-results/
          if-no-files-found: ignore

  e2e-tests:
    name: Browser seam (Playwright against the built app)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ricambi
          POSTGRES_PASSWORD: ricambi
          POSTGRES_DB: ricambi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ricambi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ricambi/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
