<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Ricambi — the Club's parts reference for Iso and Bizzarrini cars."
    />
    <title>Ricambi</title>
    <!--
      A practice system's icons by default, the roundel in Integration's colour: public/theme.js
      points these at Production's, or Development's, once it knows which system this is. An
      archive that fails to say so wears a practice icon, never the other way round.
    -->
    <link rel="icon" href="/practice/integration/favicon.ico" sizes="32x32" data-icon />
    <link rel="icon" href="/practice/integration/favicon.svg" type="image/svg+xml" data-icon />
    <link rel="apple-touch-icon" href="/practice/integration/apple-touch-icon.png" data-icon />
    <link rel="manifest" href="/practice/integration/manifest.webmanifest" data-icon />
    <!--
      Render-blocking and deliberately not inline: the API serves this app under a
      Content-Security-Policy of `script-src 'self'`, which blocks inline scripts. See
      public/theme.js.
    -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
